<!DOCTYPE html>
<html>

<head>
  <title>Калькулятор</title>
  <link rel="stylesheet" href="style.css"> 
</head>

<body>
  <div> <!-- div - это базовый html-контейнер, который может содержать в себе другие html-элементы. -->
    <div id="container">
    
      <!-- блок с экраном калькулятора, где будет выводиться результат вычислений. -->
      <div id="result" class="result">
        0
      </div>
      

      <!-- блок с кнопками калькулятора. -->
      <div>

        <!--горизонтальный ряд из четырех кнопок-->
        <div>  
          <button id="btn_op_clear" class="my-btn secondary">C</button>
          <button id="btn_op_sign" class="my-btn secondary">+/-</button>
          <button id="btn_op_percent" class="my-btn secondary">%</button>
          <button id="btn_op_div" class="my-btn secondary">/</button>
        </div>

        <div>
          <button id="btn_digit_7" class="my-btn numbers">7</button>
          <button id="btn_digit_8" class="my-btn numbers">8</button>
          <button id="btn_digit_9" class="my-btn numbers">9</button>
          <button id="btn_op_mult" class="my-btn primary">x</button>
        </div>

        <div>
          <button id="btn_digit_4" class="my-btn numbers">4</button>
          <button id="btn_digit_5" class="my-btn numbers">5</button>
          <button id="btn_digit_6" class="my-btn numbers">6</button>
          <button id="btn_op_minus" class="my-btn primary">-</button>
        </div>

        <div>
          <button id="btn_digit_1" class="my-btn numbers">1</button>
          <button id="btn_digit_2" class="my-btn numbers">2</button>
          <button id="btn_digit_3" class="my-btn numbers">3</button>
          <button id="btn_op_plus" class="my-btn primary">+</button>
        </div>

        <div>
          <button id="btn_digit_0" class="my-btn numbers">0</button>
          <button id="btn_digit_dot" class="my-btn primary">.</button>
          <button id="btn_op_equal" class="my-btn primary execute">=</button>
        </div>
        <div>
          <select id="list" class="list">
            <option value="small">маленький</option>
            <option value="medium">средний</option>
            <option value="big">большой</option>
          </select>
          <button id="github" class="my-btn" onclick="window.location.href = 'https://github.com/Qrp34ch/psp';">Git</button> 
          <button id="switch" class="my-btn">☀</button>
        </div>

        
        

      </div>
      
    </div>
    <div class = "about">
      <details>
        <summary><u>Выполнил</u></summary>
        <p style="color:black; text-align: center;"><b>Савельева Виктория РТ5-41Б</b><br></p>
    </details>
    </div>
    <div>
      <h2 id="signature" class = "signature" >
        <p>Цели ЛР: <u class = "goals">Знакомство</u> с <u class = "goals">HTML</u> и <u class = "goals">CSS</u>  </p>
      </h2>
    </div>
  </div>
</body>
</html>
